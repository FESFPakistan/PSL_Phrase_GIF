<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSL Phrase Video Maker</title>

  <!-- Tailwind CSS (Play CDN – zero-build, static HTML compatible) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fuse.js – client-side fuzzy search (no backend needed) -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <!-- Compromise – NLP lemmatizer / tense normalizer -->
  <script src="https://cdn.jsdelivr.net/npm/compromise@14.14.4/builds/compromise.js"></script>
  <!-- PSL word dictionary – must be loaded before app script -->
  <script src="words.js"></script>

  <!--
    Component classes used by JS-generated HTML are defined here with @apply
    so they stay in sync with Tailwind without any build step.
  -->
  <style type="text/tailwindcss">
    @layer components {

      /* ── Pill container (typeahead input box) ── */
      .pill-container {
        @apply flex flex-wrap items-center gap-1.5
               bg-white border-2 border-green-300 rounded-2xl
               px-3.5 py-2.5 min-h-[54px] cursor-text
               transition-all duration-200;
      }
      .pill-container:focus-within {
        @apply border-green-600 ring-4 ring-green-500/10;
      }

      /* ── Pill tags ── */
      .pill {
        @apply inline-flex items-center gap-1
               bg-green-100 text-green-800
               rounded-full py-1 pl-3 pr-2.5
               text-sm font-semibold whitespace-nowrap select-none;
      }
      .pill.no-match {
        @apply bg-slate-100 text-slate-400;
      }
      .pill-remove {
        @apply bg-transparent border-0 cursor-pointer text-inherit
               text-base leading-none opacity-55 px-0.5
               transition-opacity hover:opacity-100;
      }

      /* ── Autocomplete dropdown ── */
      .suggestions {
        @apply absolute top-[calc(100%+4px)] left-0 right-0
               bg-white border border-green-200 rounded-xl
               shadow-lg z-50 overflow-hidden max-h-[310px] overflow-y-auto;
      }
      .suggestion-item {
        @apply flex items-center gap-2.5 px-4 py-2.5
               cursor-pointer transition-colors duration-100 hover:bg-green-50;
      }
      .suggestion-item.active { @apply bg-green-50; }
      .suggestion-word { @apply font-semibold text-[0.95rem] flex-1; }
      .suggestion-badge {
        @apply text-[0.7rem] font-semibold px-2 py-0.5 rounded-xl;
      }
      .badge-prefix { @apply bg-blue-100 text-blue-700; }
      .badge-exact  { @apply bg-green-100 text-green-800; }
      .badge-lemma  { @apply bg-yellow-100 text-yellow-800; }
      .badge-alias  { @apply bg-violet-100 text-violet-700; }
      .badge-fuzzy  { @apply bg-red-100 text-red-800; }

      /* ── Clear button ── */
      .btn-clear {
        @apply bg-transparent border border-gray-300 rounded-lg
               px-3.5 py-1 text-sm cursor-pointer text-gray-500
               transition-all duration-150
               hover:bg-red-50 hover:border-red-300 hover:text-red-600;
      }

      /* ── Sign cards grid ── */
      .sign-cards { @apply flex flex-wrap gap-4; }
      .sign-card {
        @apply bg-white border border-green-100 rounded-2xl p-3.5 w-44
               flex flex-col items-center gap-2 shadow-sm
               transition-all duration-200 hover:shadow-md hover:-translate-y-0.5;
      }
      .sign-card.no-match { @apply opacity-50; }

      /* ── Media inside cards ── */
      .sign-media {
        @apply w-[148px] h-[148px] object-contain rounded-xl bg-green-50 block;
      }
      .sign-media-placeholder {
        @apply w-[148px] h-[148px] rounded-xl bg-slate-100
               flex items-center justify-center text-5xl text-slate-300;
      }
      .sign-label  { @apply font-bold text-[0.95rem] text-green-700 text-center; }
      .sign-input-word { @apply text-[0.72rem] text-slate-400 text-center; }

      /* ── Tier badges ── */
      .tier-badge { @apply text-[0.68rem] font-bold px-2 py-0.5 rounded-xl; }
      .tier-exact { @apply bg-green-100 text-green-800; }
      .tier-lemma { @apply bg-yellow-100 text-yellow-800; }
      .tier-alias { @apply bg-violet-100 text-violet-700; }
      .tier-fuzzy { @apply bg-red-100 text-red-800; }
      .tier-none  { @apply bg-slate-100 text-slate-400; }

      /* ── Alternate-candidate buttons ── */
      .alt-buttons { @apply flex flex-wrap gap-1 justify-center w-full; }
      .alt-btn {
        @apply text-[0.68rem] px-2 py-0.5 rounded-xl
               border border-green-100 bg-green-50 cursor-pointer text-green-700
               transition-all duration-100
               hover:bg-green-200 hover:border-green-300;
      }
      .alt-btn.active { @apply bg-green-600 text-white border-green-600; }

      /* ── Empty state ── */
      .empty-state { @apply w-full text-center py-14 px-6 text-green-400; }
      .empty-icon  { @apply text-5xl mb-3; }

    }
  </style>
</head>

<body class="bg-green-50 text-gray-900 min-h-screen font-sans">
<div class="max-w-4xl mx-auto px-4 pt-7 pb-16">

  <!-- ── Header ── -->
  <header class="flex items-center gap-3.5 mb-8">
    <span class="text-5xl leading-none">🤟</span>
    <div>
      <h1 class="text-2xl font-extrabold text-green-700 tracking-tight">PSL Phrase Video Maker</h1>
      <p class="text-green-800/70 text-sm mt-0.5">Pakistan Sign Language · Type a phrase to see matching signs</p>
    </div>
  </header>

  <!-- ── Phrase builder input ── -->
  <div class="relative">
    <div class="pill-container" id="pillContainer">
      <input
        type="text"
        id="typeaheadInput"
        autocomplete="off"
        spellcheck="false"
        placeholder="Type a word or paste a phrase…"
        class="flex-1 min-w-[180px] border-0 outline-none text-base bg-transparent py-1 px-0.5 text-gray-900 placeholder:text-green-300"
      />
    </div>
    <div class="suggestions" id="suggestions" hidden></div>
  </div>

  <!-- ── Toolbar ── -->
  <div class="flex items-center gap-2.5 mt-2.5 flex-wrap">
    <button class="btn-clear" id="clearBtn">✕ Clear all</button>
    <span class="text-xs text-green-500">
      Space / Enter / comma → add word &nbsp;·&nbsp; Backspace → remove last &nbsp;·&nbsp; Paste a full sentence
    </span>
  </div>

  <!-- ── Results ── -->
  <div
    id="resultsLabel"
    hidden
    class="text-[0.75rem] font-bold tracking-widest uppercase text-green-400 mt-7 mb-3"
  >Signs</div>
  <div class="sign-cards" id="signCards"></div>

</div><!-- /.max-w-4xl -->

<script>
"use strict";

// ── Configuration ────────────────────────────────────────────────────────────
var CFG = {
  FUSE_THRESHOLD:  0.42,  // Fuse distance: 0=exact match only, 1=match anything; lower=better; accepts score ≤ 0.42
  FUSE_MIN_CHARS:  2,     // minimum chars before fuzzy kicks in
  FUZZY_MAX_SCORE: 0.52,  // reject fuzzy hits with Fuse score above this
  SUGGESTION_LIMIT:8,     // max autocomplete items
  DEBOUNCE_MS:     140,   // typing debounce delay (ms)
  MAX_CANDIDATES:  3,     // max alternate candidates shown per sign card
};

// ── Stop words (ignored when tokenising pasted phrases) ──────────────────────
var STOP_WORDS = new Set([
  "is","am","are","was","were","be","been","being",
  "a","an","the","and","or","but","nor","so","yet",
  "in","on","at","to","for","of","with","by","from","as","into","onto",
  "it","its","this","that","these","those",
  "i","you","he","she","we","they","me","him","her","us","them",
  "my","your","his","our","their",
  "do","does","did","have","has","had","will","would","shall","should",
  "can","could","may","might","must","need",
  "not","no","nor","never",
]);

// ── Contraction map ──────────────────────────────────────────────────────────
var CONTRACTIONS = {
  "i'm":"i am","i've":"i have","i'll":"i will","i'd":"i would",
  "you're":"you are","you've":"you have","you'll":"you will","you'd":"you would",
  "he's":"he is","he'd":"he would","he'll":"he will",
  "she's":"she is","she'd":"she would","she'll":"she will",
  "it's":"it is","it'd":"it would","it'll":"it will",
  "we're":"we are","we've":"we have","we'll":"we will","we'd":"we would",
  "they're":"they are","they've":"they have","they'll":"they will","they'd":"they would",
  "that's":"that is","that'd":"that would","that'll":"that will",
  "there's":"there is","there're":"there are","there'll":"there will",
  "who's":"who is","who'd":"who would","who'll":"who will","who've":"who have",
  "what's":"what is","what'd":"what did","what'll":"what will",
  "where's":"where is","when's":"when is","how's":"how is","why's":"why is",
  "don't":"do not","doesn't":"does not","didn't":"did not",
  "can't":"cannot","couldn't":"could not","won't":"will not","wouldn't":"would not",
  "shouldn't":"should not","shan't":"shall not","mightn't":"might not","mustn't":"must not",
  "isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not",
  "hasn't":"has not","haven't":"have not","hadn't":"had not",
  "let's":"let us",
};

// ── Search index (built on startup) ─────────────────────────────────────────
var exactLookup = new Map();
var fuseIndex;

function buildSearchIndex() {
  exactLookup.clear();
  for (var i = 0; i < WORD_DICTIONARY.length; i++) {
    var entry = WORD_DICTIONARY[i];
    exactLookup.set(entry.baseWord.toLowerCase().trim(), entry);
    var aliases = entry.aliases || [];
    for (var j = 0; j < aliases.length; j++) {
      var ak = aliases[j].toLowerCase().trim();
      if (!exactLookup.has(ak)) exactLookup.set(ak, entry);
    }
  }
  fuseIndex = new Fuse(WORD_DICTIONARY, {
    keys: [
      { name: "baseWord", weight: 1.0 },
      { name: "aliases",  weight: 0.6 },
    ],
    threshold:          CFG.FUSE_THRESHOLD,
    includeScore:       true,
    minMatchCharLength: CFG.FUSE_MIN_CHARS,
    ignoreLocation:     true,
  });
}

// ── Normalisation pipeline ───────────────────────────────────────────────────

function expandContractions(text) {
  return text.replace(/[\w']+/g, function(w) { return CONTRACTIONS[w] || w; });
}

function normaliseWord(raw) {
  return raw.toLowerCase().trim().replace(/[^a-z]/g, "");
}

// Lemmatise via compromise (NLP), fall back to suffix stripping.
function getLemma(word) {
  if (typeof nlp !== "undefined") {
    try {
      var vDoc = nlp(word).verbs();
      if (vDoc.length > 0) {
        var inf = vDoc.toInfinitive().text().toLowerCase().trim();
        if (inf && inf !== word && /^[a-z]+$/.test(inf) && inf.length > 1) return inf;
      }
      var nDoc = nlp(word).nouns();
      if (nDoc.length > 0) {
        var sing = nDoc.toSingular().text().toLowerCase().trim();
        if (sing && sing !== word && /^[a-z]+$/.test(sing) && sing.length > 1) return sing;
      }
    } catch (_) {}
  }
  return simpleStem(word);
}

// Heuristic suffix-stripping stemmer (offline fallback).
function simpleStem(word) {
  if (word.length <= 3) return word;
  if (word.endsWith("ying")) {
    var sy1 = word.slice(0, -4) + "y";   // trying → try
    var sy2 = word.slice(0, -3) + "ie";  // dying  → die
    if (exactLookup.has(sy2)) return sy2;
    if (exactLookup.has(sy1)) return sy1;
    return word; // neither stem in dictionary; preserve original for fuzzy search
  }
  if (word.endsWith("ing")) {
    var s = word.slice(0, -3);
    if (exactLookup.has(s))       return s;
    if (exactLookup.has(s + "e")) return s + "e";
    return s;
  }
  if (word.endsWith("ied")) return word.slice(0, -3) + "y";
  if (word.endsWith("ed")) {
    var s2 = word.slice(0, -2);
    if (exactLookup.has(s2))        return s2;
    if (exactLookup.has(s2 + "e")) return s2 + "e";
    return s2;
  }
  if (word.endsWith("ies"))                       return word.slice(0, -3) + "y";
  if (word.endsWith("ves"))                       return word.slice(0, -3) + "f";
  if (word.endsWith("es") && word.length > 4) {
    var s3 = word.slice(0, -2);
    if (exactLookup.has(s3)) return s3;
    return word.slice(0, -1);
  }
  if (word.endsWith("s") && word.length > 3)     return word.slice(0, -1);
  return word;
}

// Tokenise a free-text phrase (handles contractions + stop word removal).
function tokenisePhrase(phrase) {
  var text = phrase.toLowerCase().trim();
  text = expandContractions(text);
  text = text.replace(/[^a-z\s]/g, " ");
  return text.split(/\s+/).filter(function(t) {
    return t.length > 1 && !STOP_WORDS.has(t);
  });
}

// ── Tiered matching ──────────────────────────────────────────────────────────
// Returns [{entry, score, tier}] sorted best-first.
function findBestMatches(rawWord) {
  var norm = normaliseWord(rawWord);
  if (!norm) return [];

  // Tier 1 – exact
  var e1 = exactLookup.get(norm);
  if (e1) return [{ entry: e1, score: 1.0, tier: "exact" }];

  // Tier 2 – lemma
  var lemma = getLemma(norm);
  if (lemma !== norm) {
    var e2 = exactLookup.get(lemma);
    if (e2) return [{ entry: e2, score: 0.9, tier: "lemma" }];
  }

  // Tier 3 – fuzzy
  var candidates = [];
  if (norm.length >= CFG.FUSE_MIN_CHARS) {
    var hits = fuseIndex.search(norm);
    for (var i = 0; i < Math.min(hits.length, CFG.MAX_CANDIDATES * 2); i++) {
      if ((hits[i].score || 0) < CFG.FUZZY_MAX_SCORE) {
        candidates.push({ entry: hits[i].item, score: 1 - (hits[i].score || 0), tier: "fuzzy" });
      }
    }
    if (lemma !== norm) {
      var lhits = fuseIndex.search(lemma);
      for (var k = 0; k < Math.min(lhits.length, 2); k++) {
        if ((lhits[k].score || 0) < CFG.FUZZY_MAX_SCORE) {
          var already = candidates.some(function(c) { return c.entry.baseWord === lhits[k].item.baseWord; });
          if (!already) {
            candidates.push({ entry: lhits[k].item, score: (1 - (lhits[k].score || 0)) * 0.85, tier: "fuzzy" });
          }
        }
      }
    }
  }
  return candidates.sort(function(a, b) { return b.score - a.score; }).slice(0, CFG.MAX_CANDIDATES);
}

// ── Autocomplete suggestions ─────────────────────────────────────────────────
function getSuggestions(rawInput) {
  var norm = normaliseWord(rawInput);
  if (!norm) return [];
  var lemma = getLemma(norm);
  var seen  = new Map();

  // Prefix matches (highest priority)
  for (var i = 0; i < WORD_DICTIONARY.length; i++) {
    var entry = WORD_DICTIONARY[i];
    var bw = entry.baseWord.toLowerCase();
    if (bw.startsWith(norm) || (lemma !== norm && bw.startsWith(lemma))) {
      seen.set(bw, { entry: entry, score: 1.0, matchType: "prefix" });
      continue;
    }
    var aliases = entry.aliases || [];
    for (var j = 0; j < aliases.length; j++) {
      if (aliases[j].toLowerCase().startsWith(norm)) {
        if (!seen.has(bw)) seen.set(bw, { entry: entry, score: 0.85, matchType: "alias" });
        break;
      }
    }
  }

  // Exact via index
  var eEntry = exactLookup.get(norm) || exactLookup.get(lemma);
  if (eEntry && !seen.has(eEntry.baseWord.toLowerCase())) {
    seen.set(eEntry.baseWord.toLowerCase(), { entry: eEntry, score: 0.95, matchType: "exact" });
  }

  // Fuzzy fill-up
  if (norm.length >= CFG.FUSE_MIN_CHARS) {
    var hits = fuseIndex.search(norm);
    for (var h = 0; h < hits.length && seen.size < CFG.SUGGESTION_LIMIT + 2; h++) {
      var bk = hits[h].item.baseWord.toLowerCase();
      if (!seen.has(bk) && (hits[h].score || 0) < CFG.FUZZY_MAX_SCORE) {
        seen.set(bk, { entry: hits[h].item, score: 1 - (hits[h].score || 0), matchType: "fuzzy" });
      }
    }
  }

  return Array.from(seen.values())
    .sort(function(a, b) { return b.score - a.score; })
    .slice(0, CFG.SUGGESTION_LIMIT);
}

// ── Pill state ───────────────────────────────────────────────────────────────
// pills = [{ rawWord, candidates:[{entry,score,tier}], candidateIdx }]
var pills = [];

function addPill(rawWord) {
  var word = rawWord.trim();
  if (!word) return;
  pills.push({ rawWord: word, candidates: findBestMatches(word), candidateIdx: 0 });
  renderPills();
  renderCards();
}

function addPhrasePills(phrase) {
  var tokens = tokenisePhrase(phrase);
  for (var i = 0; i < tokens.length; i++) {
    pills.push({ rawWord: tokens[i], candidates: findBestMatches(tokens[i]), candidateIdx: 0 });
  }
  renderPills();
  renderCards();
}

function removePill(idx) {
  pills.splice(idx, 1);
  renderPills();
  renderCards();
}

function clearAll() {
  pills = [];
  renderPills();
  renderCards();
}

function setCandidateIdx(pillIdx, candIdx) {
  pills[pillIdx].candidateIdx = candIdx;
  renderCards();
}

// ── Render pills ─────────────────────────────────────────────────────────────
function renderPills() {
  var container = document.getElementById("pillContainer");
  var input     = document.getElementById("typeaheadInput");
  container.querySelectorAll(".pill").forEach(function(el) { el.remove(); });

  pills.forEach(function(pill, i) {
    var hasMatch = pill.candidates && pill.candidates.length > 0;
    var span = document.createElement("span");
    span.className = "pill" + (hasMatch ? "" : " no-match");
    span.innerHTML =
      esc(pill.rawWord) +
      '<button class="pill-remove" data-idx="' + i + '" aria-label="Remove">\xd7</button>';
    container.insertBefore(span, input);
  });

  container.querySelectorAll(".pill-remove").forEach(function(btn) {
    btn.addEventListener("click", function(e) {
      e.stopPropagation();
      removePill(parseInt(this.dataset.idx, 10));
    });
  });
}

// ── Render sign cards ────────────────────────────────────────────────────────
function renderCards() {
  var container    = document.getElementById("signCards");
  var resultsLabel = document.getElementById("resultsLabel");
  container.innerHTML = "";

  if (pills.length === 0) {
    resultsLabel.hidden = true;
    container.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon">\ud83e\udd1f</div>' +
        '<p>Type words or paste a phrase above to see PSL signs</p>' +
      '</div>';
    return;
  }

  resultsLabel.hidden = false;

  pills.forEach(function(pill, pillIdx) {
    var card     = document.createElement("div");
    var hasMatch = pill.candidates && pill.candidates.length > 0;
    card.className = "sign-card" + (hasMatch ? "" : " no-match");

    if (!hasMatch) {
      card.innerHTML =
        '<div class="sign-media-placeholder">\ud83e\udd37</div>' +
        '<div class="sign-label">' + esc(pill.rawWord) + '</div>' +
        '<span class="tier-badge tier-none">not found</span>';
    } else {
      var match   = pill.candidates[pill.candidateIdx || 0];
      var entry   = match.entry;
      var isGif   = /\.gif$/i.test(entry.videoUrl);
      var src     = esc(entry.videoUrl);
      var alt     = esc(entry.baseWord);

      var mediaEl = isGif
        ? '<img src="' + src + '" alt="' + alt + '" class="sign-media" loading="lazy">'
        : '<video src="' + src + '" class="sign-media" autoplay loop muted playsinline></video>';

      var typedNote = pill.rawWord.toLowerCase() !== entry.baseWord.toLowerCase()
        ? '<div class="sign-input-word">\u2191 typed: ' + esc(pill.rawWord) + '</div>'
        : '';

      var altBtns = "";
      if (pill.candidates.length > 1) {
        altBtns = '<div class="alt-buttons">';
        pill.candidates.forEach(function(c, ci) {
          altBtns +=
            '<button class="alt-btn' + (ci === (pill.candidateIdx || 0) ? ' active' : '') + '" ' +
              'data-pill="' + pillIdx + '" data-cand="' + ci + '">' +
              esc(c.entry.baseWord) + '</button>';
        });
        altBtns += '</div>';
      }

      card.innerHTML =
        mediaEl +
        '<div class="sign-media-placeholder" style="display:none">\ud83d\udcf7</div>' +
        '<div class="sign-label">' + esc(entry.baseWord) + '</div>' +
        typedNote +
        '<span class="tier-badge tier-' + match.tier + '">' + match.tier + '</span>' +
        altBtns;
    }

    container.appendChild(card);
  });

  container.querySelectorAll(".alt-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      setCandidateIdx(parseInt(this.dataset.pill, 10), parseInt(this.dataset.cand, 10));
    });
  });

  // Attach media-error handlers via addEventListener (avoids inline event attributes).
  container.querySelectorAll(".sign-media").forEach(function(media) {
    media.addEventListener("error", function() {
      this.style.display = "none";
      var placeholder = this.nextElementSibling;
      if (placeholder && placeholder.classList.contains("sign-media-placeholder")) {
        placeholder.style.display = "flex";
      }
    });
  });
}

// ── Autocomplete UI ──────────────────────────────────────────────────────────
var activeSuggIdx = -1;
var debounceTimer;

function showSuggestions(items) {
  var dropdown = document.getElementById("suggestions");
  if (!items.length) { hideSuggestions(); return; }
  activeSuggIdx = -1;
  dropdown.innerHTML = "";
  items.forEach(function(s, idx) {
    var item = document.createElement("div");
    item.className = "suggestion-item";
    item.dataset.idx = idx;
    item.innerHTML =
      '<span class="suggestion-word">' + esc(s.entry.baseWord) + '</span>' +
      '<span class="suggestion-badge badge-' + s.matchType + '">' + s.matchType + '</span>';
    item.addEventListener("mouseover", function() { setActiveSugg(idx); });
    item.addEventListener("mousedown", function(e) {
      e.preventDefault();
      confirmSuggestion(s.entry.baseWord);
    });
    dropdown.appendChild(item);
  });
  dropdown.hidden = false;
}

function hideSuggestions() {
  document.getElementById("suggestions").hidden = true;
  activeSuggIdx = -1;
}

function setActiveSugg(idx) {
  activeSuggIdx = idx;
  document.querySelectorAll(".suggestion-item").forEach(function(el, i) {
    el.classList.toggle("active", i === idx);
  });
}

function confirmSuggestion(word) {
  document.getElementById("typeaheadInput").value = "";
  addPill(word);
  hideSuggestions();
  document.getElementById("typeaheadInput").focus();
}

// ── Input event handlers ─────────────────────────────────────────────────────
function onInput(e) {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(function() {
    var val = e.target.value.trim();
    if (!val) { hideSuggestions(); return; }
    showSuggestions(getSuggestions(val));
  }, CFG.DEBOUNCE_MS);
}

function onKeydown(e) {
  var input    = e.target;
  var dropdown = document.getElementById("suggestions");
  var items    = dropdown.querySelectorAll(".suggestion-item");

  if (e.key === "ArrowDown")  { e.preventDefault(); setActiveSugg(Math.min(activeSuggIdx + 1, items.length - 1)); return; }
  if (e.key === "ArrowUp")    { e.preventDefault(); setActiveSugg(Math.max(activeSuggIdx - 1, 0));               return; }
  if (e.key === "Escape")     { hideSuggestions(); return; }

  if (e.key === "Enter" || e.key === " " || e.key === ",") {
    if (!dropdown.hidden && activeSuggIdx >= 0 && items[activeSuggIdx]) {
      e.preventDefault();
      var word = items[activeSuggIdx].querySelector(".suggestion-word").textContent;
      confirmSuggestion(word);
      return;
    }
    var val = input.value.trim().replace(/[, ]+$/, "");
    if (!val) return;
    e.preventDefault();
    if (val.indexOf(" ") !== -1) { addPhrasePills(val); } else { addPill(val); }
    input.value = "";
    hideSuggestions();
    return;
  }

  if (e.key === "Backspace" && input.value === "" && pills.length > 0) {
    var last = pills[pills.length - 1];
    removePill(pills.length - 1);
    input.value = last.rawWord;
    hideSuggestions();
  }
}

function onPaste(e) {
  e.preventDefault();
  var text = (e.clipboardData || window.clipboardData).getData("text");
  if (!text) return;
  var input = document.getElementById("typeaheadInput");
  var cur   = input.value.trim();
  if (cur) { addPill(cur); input.value = ""; }
  addPhrasePills(text);
  hideSuggestions();
}

// ── Utility ──────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// ── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", function() {
  buildSearchIndex();

  var input    = document.getElementById("typeaheadInput");
  var pillBox  = document.getElementById("pillContainer");
  var clearBtn = document.getElementById("clearBtn");

  input.addEventListener("input",   onInput);
  input.addEventListener("keydown", onKeydown);
  input.addEventListener("paste",   onPaste);
  input.addEventListener("blur",    function() { setTimeout(hideSuggestions, 160); });
  pillBox.addEventListener("click", function() { input.focus(); });
  clearBtn.addEventListener("click", function() {
    clearAll();
    input.value = "";
    hideSuggestions();
    input.focus();
  });

  renderCards(); // show empty state
});
</script>
</body>
</html>
